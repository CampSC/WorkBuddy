# Memória para o processo do Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Usar as bibliotecas AndroidX (as "novas" bibliotecas de suporte).
android.useAndroidX=true
# Cada módulo só vê os seus próprios recursos R (builds mais rápidos).
android.nonTransitiveRClass=true
kotlin.code.style=official
